name: Fetch index data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"  # 04:30 UTC יומי - אחרי סגירת כל הבורסות הרלוונטיות

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests pandas lxml
      - name: Fetch prices
        run: python scripts/fetch_prices.py
      - name: Fetch constituents
        run: python scripts/fetch_constituents.py
      - name: Fetch single-name underliers (option exposure)
        run: python scripts/fetch_single_names.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices data/constituents
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Daily index data update ($(date -u +%Y-%m-%d))"
          git push
