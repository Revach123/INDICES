name: Data source probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Probe
        run: python scripts/probe.py
      - name: Probe TR sources
        run: python scripts/probe_tr.py
      - name: Audit instrument types (INDEX vs ETF)
        run: python scripts/probe_instrument_types.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe_out
          path: probe_out/
