name: Data source probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Probe
        run: python scripts/probe.py
      - name: Probe TR sources
        run: python scripts/probe_tr.py
      - name: Audit instrument types (INDEX vs ETF)
        run: python scripts/probe_instrument_types.py
      - name: Probe MAOF underlying list sources
        run: python scripts/probe_maof.py
      - name: Verify TASE stock tickers against Yahoo Finance
        run: python scripts/probe_tase_stocks.py
      - name: Probe daily-granularity handling for long ranges
        run: python scripts/probe_daily_granularity.py
      - name: Probe TASE official derivatives API
        run: python scripts/probe_tase_derivatives.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe_out
          path: probe_out/
      - name: Commit readable probe text/json (for inspection via raw.githubusercontent.com)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p probe_out_committed
          cp probe_out/*.txt probe_out_committed/ 2>/dev/null || true
          cp probe_out/*.json probe_out_committed/ 2>/dev/null || true
          git add probe_out_committed
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Probe: readable text/json snapshot for inspection"
          git push
